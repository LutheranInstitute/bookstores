function showCart(){if(!cart.length){open('<h2>'+t('cart')+'</h2><p class="desc">'+t('empty')+'</p><button class="btn ghost" data-close>'+t('keep')+'</button>',['c']);return}
var rows=cart.map(function(i){var p=find(i.v);if(!p)return '';return '<div class="li"><img src="'+esc(p.i)+'" alt=""><div class="n">'+esc(p.t)+'<br><span class="pr">'+money(p.p*i.q)+'</span></div><div class="q"><button data-dq="'+i.v+'">−</button>'+i.q+'<button data-iq="'+i.v+'">+</button></div></div>'}).join('');
open('<h2>'+t('cart')+'</h2>'+rows+'<div class="tot"><span>'+t('sub')+'</span><span>'+money(total())+'</span></div><a class="btn" target="_blank" rel="noopener" href="'+checkoutUrl()+'">'+t('pay')+'</a><p class="note">'+t('payNote')+'</p>',['c'])}
function visit(){open('<h2>'+t('visit')+'</h2><div class="info"><b>L://Gospel_Bookstore</b><br>1219 Baltimore St, Laredo, TX 78041</div><div class="hours"><span>'+t('days')+'</span><span>'+t('hrs')+'</span><span>'+t('sun')+'</span><span>'+t('shut')+'</span></div><div class="info">'+t('pick')+'</div><a class="btn" href="tel:+19567224047">'+t('call')+'</a><a class="btn ghost" target="_blank" rel="noopener" href="https://maps.apple.com/directions?destination=1219%20Baltimore%20St%2C%20Laredo%2C%20TX%2078041">'+t('dir')+'</a><a class="btn ghost" href="mailto:Info@LibrosEvangelicos.com">Info@LibrosEvangelicos.com</a>',['v'])}
function about(){open('<h2>✝️ Gospel</h2><p class="desc">'+t('about1')+'</p><p class="desc">'+t('about2')+'</p><a class="btn ghost" target="_blank" rel="noopener" href="'+SHOP+'/pages/book-club">'+t('club')+'</a><a class="btn ghost" target="_blank" rel="noopener" href="https://lutheraninstitute.github.io/historia/">'+t('hist')+'</a><p class="note">L:// Aprender · æ:// Construir · æQR:// Compartir</p>',['a'])}
function reopen(){if(!cur)return;var k=cur[0];if(k==='p')product(cur[1]);if(k==='c')showCart();if(k==='v')visit();if(k==='a')about()}
function setLang(l){L=l;localStorage.setItem('gospel_lang',l);document.documentElement.lang=l;$('lang').textContent=l==='es'?'EN':'ES';$('kick').textContent=t('kick');$('q').placeholder=t('ph');$('ft').textContent=t('ft');document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});tickClock();verse();chips();grid();reopen()}
function setTheme(m){TH=m;localStorage.setItem('gospel_theme',m);document.querySelector('.device').classList.toggle('day',m==='day');$('theme').textContent=m==='day'?'☾':'☀';document.querySelector('meta[name=theme-color]').content=m==='day'?'#f6f1e3':'#050516'}
function log(x,me){var d=document.createElement('div');if(me)d.className='me';d.textContent=(me?'æ> ':'')+x;$('log').appendChild(d);$('log').scrollTop=1e6}
function cmd(s){log(s,1);var m=s.trim().replace(/^\/?✨?\s*/,'').split(/\s+/),c=(m.shift()||'').toLowerCase(),a=m.join(' ');
if(c==='buscar'||c==='search'){$('q').value=a;cat='Todos';chips();grid();log(list().length+t('res')+'“'+a+'”.')}
else if(c==='cat'){var k=CATS.find(function(x){return x.toLowerCase()===a.toLowerCase()||cn(x).toLowerCase()===a.toLowerCase()||T.en.c[x].toLowerCase()===a.toLowerCase()});if(k){cat=k;chips();grid();log(cn(k)+': '+list().length+t('items'))}else log(t('cats')+CATS.map(cn).join(', '))}
else if(c==='carrito'||c==='cart'){showCart();log(cart.length?t('sub')+' '+money(total()):t('emptyC'))}
else if(c==='pagar'||c==='checkout'){if(!cart.length)log(t('emptyC'));else{log(t('opening'));window.open(checkoutUrl(),'_blank','noopener')}}
else if(c==='visitar'||c==='visit'||c==='mapa'||c==='map'){visit();log('1219 Baltimore St, Laredo, TX')}
else if(c==='horario'||c==='hours'){log(t('hours')+$('status').textContent)}
else if(c==='llamar'||c==='call'){location.href='tel:+19567224047'}
else if(c==='en'||c==='es'){setLang(c);log(t('hello'))}
else if(c==='día'||c==='dia'||c==='day'){setTheme('day')}
else if(c==='noche'||c==='night'){setTheme('night')}
else log(t('help'))}
document.addEventListener('click',function(e){var x=e.target.closest('[data-add],[data-v],[data-c],[data-a],[data-close],[data-iq],[data-dq],#lang,#theme');if(!x)return;
if(x.id==='lang'){setLang(L==='es'?'en':'es');return}
if(x.id==='theme'){setTheme(TH==='day'?'night':'day');return}
if(x.dataset.add){e.stopPropagation();add(+x.dataset.add);return}
if(x.dataset.iq){add(+x.dataset.iq);showCart();return}
if(x.dataset.dq){var i=cart.find(function(y){return y.v===+x.dataset.dq});if(i){i.q--;if(i.q<1)cart=cart.filter(function(y){return y!==i})}save();showCart();return}
if(x.hasAttribute('data-close')){close();return}
if(x.dataset.v){product(+x.dataset.v);return}
if(x.dataset.c){cat=x.dataset.c;chips();grid();$('view').scrollTop=0;return}
var a=x.dataset.a;if(a){document.querySelectorAll('.dock button').forEach(function(b){b.classList.toggle('on',b===x&&a!=='cli')});
if(a==='cli'){$('cli').classList.toggle('open');if($('cli').classList.contains('open'))$('ci').focus()}else{$('cli').classList.remove('open');if(a==='store')close();if(a==='cart')showCart();if(a==='visit')visit();if(a==='about')about()}}});
$('sheet').addEventListener('click',function(e){if(e.target===this)close()});
$('q').addEventListener('input',grid);
$('cf').addEventListener('submit',function(e){e.preventDefault();var v=$('ci').value;if(v.trim())cmd(v);$('ci').value=''});
setTheme(TH);setLang(L);setInterval(tickClock,30000);setInterval(function(){verse(1)},8000);
log(t('hello')+t('help'));
fetch('catalog.json').then(function(r){return r.json()}).then(function(d){P=d;chips();grid();save()}).catch(function(){$('count').textContent=t('fail')});
})();
</script>
</body>
</html>
